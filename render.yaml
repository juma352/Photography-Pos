services:
  # Web Service (Laravel App with Docker)
  - type: web
    name: photography-portfolio
    runtime: docker
    plan: starter  # Change to 'free' if you want the free tier
    region: frankfurt  # Closest to Germany
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    
    # Environment Variables
    # Note: Render Blueprints do not auto-create databases. Create a PostgreSQL
    # database manually in Render Dashboard and add the DB_* environment variables after deployment.
    envVars:
      - key: APP_NAME
        value: Mawingu Photography
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Europe/Berlin
      - key: APP_KEY
        sync: false  # You'll set this manually with your generated key
      - key: APP_URL
        value: https://photography-portfolio.onrender.com  # Update with your actual URL
      
      # Database - Create a PostgreSQL database manually in Render Dashboard
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false  # Set from PostgreSQL dashboard (internal hostname)
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        sync: false  # Set from PostgreSQL dashboard
      - key: DB_USERNAME
        sync: false  # Set from PostgreSQL dashboard
      - key: DB_PASSWORD
        sync: false  # Set from PostgreSQL dashboard
      
      # Cache & Session
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: "120"
      - key: QUEUE_CONNECTION
        value: database
      
      # Logging
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error

    # Health check
    healthCheckPath: /

    # Auto-deploy on push
    autoDeploy: true
